name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docker-build:
    name: Docker build (lint, format, typecheck, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Smoke and screenshot tests (Playwright, see e2e/) against the built nginx image. A failing screenshot
  # comparison uploads the expected, actual and diff images as an artifact.
  e2e:
    name: E2E (Playwright smoke and screenshots)
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Run Playwright tests
        run: docker compose --profile e2e run --build --rm e2e
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            e2e/test-results
            e2e/playwright-report
          if-no-files-found: ignore
