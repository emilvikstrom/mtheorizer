server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/manifest+json image/svg+xml;

  # Built files have a content hash in their name, so they never change.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # The service worker, the manifest and the page must be revalidated on every
  # load, or a new deploy would not reach people who have the app installed.
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
